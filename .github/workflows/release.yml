name: Release installable module
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build JoomShopping installer archive
        run: scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: joomshopping-begateway
          path: dist/joomshopping-begateway.zip
      - name: Publish release archive
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/joomshopping-begateway.zip
          generateReleaseNotes: true
          artifactErrorsFailBuild: true
